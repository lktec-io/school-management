# =============================================================================
# School Management System — Nginx site (installed by deploy.sh)
#
# Production site for https://school.clixworks.co.tz. deploy.sh installs it as
# /etc/nginx/sites-available/school-system (substituting the domain/app dir only if
# --domain/--app-dir differ). TLS certificates come from Let's Encrypt (certbot, webroot);
# renewal runs automatically via the certbot systemd timer.
# =============================================================================

# Shared per-IP limits (the Node workers add their own limits behind these).
limit_req_zone  $binary_remote_addr zone=school_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=school_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=school_conn:10m;

upstream school_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# --- HTTP: ACME challenges, everything else redirected to HTTPS ---------------
server {
    listen 80;
    listen [::]:80;
    server_name school.clixworks.co.tz;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://school.clixworks.co.tz$request_uri;
    }
}

# --- HTTPS: React portal + API reverse proxy ----------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name school.clixworks.co.tz;
    server_tokens off;

    ssl_certificate         /etc/letsencrypt/live/school.clixworks.co.tz/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/school.clixworks.co.tz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/school.clixworks.co.tz/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SchoolSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    root /var/www/school-system/client/dist;
    index index.html;

    # Branding uploads (base64 images) are the largest request bodies.
    client_max_body_size 5m;
    limit_conn school_conn 60;

    access_log /var/log/nginx/school-system.access.log;
    error_log  /var/log/nginx/school-system.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Security headers. Declared once at server level: an add_header inside a location
    # would silently drop all of these, so locations below only use `expires`.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Sign-in: strict brute-force throttle.
    location = /api/v1/auth/login {
        limit_req zone=school_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://school_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # On-demand database backup: long-running, streamed straight to the browser.
    location = /api/v1/system/backup {
        limit_req zone=school_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://school_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # REST API.
    location /api/ {
        limit_req zone=school_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://school_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Fingerprinted Vite assets never change: cache for a year.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # The app shell must always be revalidated so deployments take effect immediately.
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths render the React router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (.env, .git …) even if one lands in the web root.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
